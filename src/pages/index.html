<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERP</title>

    <link rel="stylesheet" href="../css/common.css">
</head>

<body>

    <div class="page-root">

        <main class="page-container stack">

            <header class="row">

                <h1>ERP</h1>

                <span id="currentUserName"></span>

                <span id="currentUserRole"></span>

                <button id="logoutButton" type="button">로그아웃</button>

            </header>

            <p id="pageError" role="alert" hidden></p>

            <!-- 대시보드 구현 전 현재 완료된 업무 화면으로 이동하기 위한 진입 메뉴 -->
            <nav class="row" aria-label="구현된 ERP 업무 화면">
                <button id="usersMenuButton" type="button">사용자 관리</button>
                <button id="customersMenuButton" type="button">거래처 관리</button>
                <button id="suppliersMenuButton" type="button">공급업체 관리</button>
                <button id="itemsMenuButton" type="button">품목 관리</button>
                <button id="warehousesMenuButton" type="button">창고 관리</button>
                <button id="safetyStocksMenuButton" type="button">안전재고 관리</button>
                <button id="purchaseOrdersMenuButton" type="button">발주 목록</button>
                <button id="receiptsMenuButton" type="button">입고 목록</button>
                <button id="purchaseReturnsMenuButton" type="button">매입 반품</button>
                <button id="ordersMenuButton" type="button">주문 목록</button>
                <button id="shipmentsMenuButton" type="button">출고 목록</button>
            </nav>

        </main>

    </div>

    <script type="module" src="../js/index.js"></script>

</body>
</html>
